<!DOCTYPE html>
<html lang="id" style="--so: 450px;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taman Anggrek Nusantara</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#14233f;--mute:#5b6577;--line:#e6e1d3;--soft:#eef0f4;--tint:#fffbea;--beige:#f2e6d3;--plum:#8a6a2f;--gold:#e3c58a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#fff;color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.6;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:20}
a{color:inherit;text-decoration:none}
h1,h2,h3,.sp,.logo{font-family:'Cormorant Garamond',serif}
.sp{font-style:italic;font-weight:600}
.wrap{max-width:1120px;margin:auto;padding:0 5vw}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:12px;flex-wrap:wrap;gap:8px}
.logo{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:10px}.lg{width:auto;object-fit:contain}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 14px;border-radius:99px;font-size:.88rem;color:var(--mute)}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--ink);color:#fff}
.bar{background:var(--ink);color:#fff;font-size:.8rem;padding:8px 0}
.bar b{background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 10px;margin-right:8px;font-weight:500;font-size:.72rem}
.bc{font-size:.78rem;color:var(--mute);padding-top:26px}
.bc a:hover{color:var(--plum)}
h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;font-weight:600;margin:8px 0 10px}
h2{font-size:1.8rem;font-weight:600}
.lead{color:var(--mute);max-width:62ch}
.sec{padding:48px 0}
.tint{background:var(--tint)}
.dark{background:var(--ink);color:#fff}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.sh a{font-size:.85rem;color:var(--plum);font-weight:500}
.tint .sh a{color:var(--plum)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ph{display:grid;place-items:center;text-align:center;padding:10px;background:var(--soft);color:#9a9a9a;font-size:.75rem;border-radius:12px}
.tint .ph{background:#fff}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;transition:.2s}
a.card:hover{border-color:var(--ink);transform:translateY(-3px)}
.cb{padding:12px 8px 6px}
.cb h3{font-size:1.3rem;line-height:1.2;font-weight:600;margin:4px 0 2px}
.cb p,.cb small{color:var(--mute);font-size:.83rem;display:block}
.tag{display:inline-block;font-size:.68rem;font-weight:500;padding:1px 10px;border-radius:99px;background:var(--beige);color:#6b4f1d}
.tint .tag{background:var(--beige)}
.btn{display:inline-block;padding:9px 22px;border-radius:99px;border:1px solid var(--ink);font-size:.88rem;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.p{background:var(--ink);color:#fff}
.btn.s{padding:5px 14px;font-size:.78rem}
.btn.pl{background:var(--plum);border-color:var(--plum);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{padding:5px 14px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--plum);outline-offset:-1px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center;padding:56px 0}
.hero h1{font-size:clamp(2.8rem,6vw,4.6rem)}
.btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.stats{display:flex;gap:0;flex-wrap:wrap;justify-content:center;text-align:center;padding:18px 0 46px}
.stats b{display:block;font:700 clamp(3.4rem,6.5vw,5.2rem)/1 Outfit,sans-serif;color:var(--gold);letter-spacing:-.03em;margin-bottom:8px}
.stats span{font-size:.95rem;font-weight:500;color:#fff;letter-spacing:.02em}.stats>div{padding:0 clamp(22px,6vw,90px)}.stats>div+div{border-left:1px solid rgba(227,197,138,.4)}
.denah{display:grid;grid-template-columns:1fr 1.4fr;gap:30px;align-items:center}

footer .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:44px}
footer .logo{color:#fff;font-size:1.5rem;display:flex}

footer a:hover{color:var(--gold)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-top:20px}

.side .out{margin-top:auto;font-size:.78rem}
.main{padding:34px 5vw 60px;max-width:960px;width:100%}
.main h1{font-size:2.3rem;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.pan{border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.pan h3{font-size:1.35rem;font-weight:600;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.88rem;flex-wrap:wrap}
.row:last-child{border:0}.row small{color:var(--mute)}
.ac{display:flex;gap:6px;align-items:center}
.st{font-size:.68rem;padding:1px 10px;border-radius:99px;background:#e7f4ea;color:#256b3a}.st.d{background:#fdf1d8;color:#8a5a00}
.f{display:block;font-size:.8rem;font-weight:500;margin:12px 0 4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sw{position:relative;width:38px;height:22px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#ccc;border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--plum)}.sw input:checked+i::after{left:19px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sts div{border:1px solid var(--line);border-radius:14px;padding:14px}.sts b{font:600 2.2rem/1 'Cormorant Garamond',serif;color:var(--plum);display:block}.sts span{font-size:.78rem;color:var(--mute)}
@media(max-width:780px){.fe{grid-template-columns:1fr}footer .wrap{grid-template-columns:1fr}.hero,.denah,.two,.cols{grid-template-columns:1fr}.ad{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side small{display:none}.side .out{margin:0}}
/* ===== header halaman dalam (koleksi, genus, galeri, berita, tentang) ===== */
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.pgh{position:relative;background:var(--ink);color:#fff;padding-bottom:84px}

<script id="dbdata" type="application/json">{"i":{},"s":{"phalaenopsis-amabilis":{"kons":"Not Evaluated/NE IUCN Red List","sin":"Epidendrum amabile L.","d":"Phalaenopsis amabilis atau anggrek bulan merupakan anggrek epifit yang dikenal karena keindahan bunganya yang berwarna putih dengan bentuk menyerupai kupu-kupu. Bunga tersusun pada tangkai yang dapat bercabang dan memiliki masa mekar relatif panjang. Spesies ini merupakan salah satu anggrek khas Indonesia yang ditetapkan sebagai salah satu bunga nasional dengan nama Puspa Pesona. Selain memiliki nilai estetika, anggrek bulan juga menjadi salah satu spesies penting dalam pengembangan berbagai varietas anggrek hias.","e":"Tumbuh secara epifit dengan menempel pada batang dan cabang pohon, serta terkadang pada bebatuan di kawasan hutan hujan tropis dataran rendah. Anggrek ini umumnya ditemukan pada lingkungan dengan kelembapan udara tinggi, sirkulasi udara yang baik, dan intensitas cahaya tidak langsung. Akarnya yang terbuka memungkinkan tumbuhan menyerap kelembapan dan unsur hara dari lingkungan sekitarnya.","m":"Memiliki daun berwarna hijau tua, berbentuk lebar dan lonjong, dengan tekstur tebal serta agak berdaging. Daun tersusun berhadapan pada batang yang pendek. Akarnya tebal, berdaging, dan tumbuh dari pangkal batang. Tangkai bunga tumbuh dari sela-sela daun, dapat bercabang, dan menghasilkan sejumlah bunga berwarna putih. Bunganya memiliki lima bagian utama berupa tiga sepal dan dua petal, serta satu labellum (bibir bunga) yang memiliki tiga lobus dengan bagian tengah menyerupai dua sulur memanjang."}},"g":{},"sn":6,"logoH":36,"ts":1794371707081,"xg":[],"n":[{"id":7,"c":"Dokumentasi koleksi","t":"Perkaya Koleksi Taman Anggrek Nusantara, OIKN Budidayakan Berbagai Anggrek Hibrida Hasil Pemuliaan","d":"Ibu Kota Nusantara — Otorita Ibu Kota Nusantara (OIKN) terus memperkaya keanekaragaman koleksi tanaman di Taman Anggrek Nusantara. Upaya ini diwujudkan melalui pembudidayaan dan pemeliharaan intensif berbagai varietas anggrek hibrida unggulan hasil pemuliaan tanaman (plant breeding).\n\nKoleksi tersebut didominasi oleh hibrida jenis Dendrobium yang memiliki keunikan pada bentuk kelopak, pola pilinan, serta kombinasi warna yang khas. Pembudidayaan varietas-varietas ini sekaligus memperkuat pengembangan keanekaragaman hayati yang terus dipelihara di area nurseri.\n\nSejumlah koleksi anggrek hibrida hasil pemuliaan yang saat ini dikembangkan dan dirawat di area nurseri meliputi Dendrobium Mufidah JK x Health Hero, Dendrobium Nandia Anindhiya x Aiko Yumna, serta Dendrobium Tiara Beauty x Cut Nyak Dhien. Selain itu, terdapat pula varietas Dendrobium Arendanggeren x Jade Fancy Mutasi dan Dendrobium Mpu Gandring x Kick Covid yang turut menambah kekayaan koleksi di kawasan tersebut.\n\nPengembangan koleksi hibrida ini disiapkan untuk mempercantik lanskap kawasan, sekaligus mendukung upaya konservasi dan penangkaran tanaman secara terstruktur. Melalui perawatan berkala di area nurseri, seluruh koleksi anggrek terus dipastikan tumbuh sehat agar siap menjadi sarana edukasi hayati yang menarik saat Taman Anggrek Nusantara resmi dibuka untuk publik.","dt":"11 November 2026"},{"id":6,"c":"Kunjungan dan kegiatan","t":"OIKN Gandeng Berbagai Mitra Optimalkan Persemaian Taman Anggrek Nusantara","d":"Ibu Kota Nusantara — Otorita Ibu Kota Nusantara (OIKN) berkolaborasi dengan Pecinta Anggrek Indonesia (PAI) Kalimantan Timur, Badan Riset dan Inovasi Nasional (BRIN), Asosiasi Petani Ibu Kota (APIK), dan Pupuk Kalimantan Timur (PKT) menggelar tinjauan lapangan serta diskusi teknis di Taman Anggrek Nusantara.\n\nTinjauan yang berlangsung langsung di area nurseri ini berfokus pada evaluasi kondisi lingkungan tumbuh anggrek, seperti suhu, kelembapan, dan intensitas cahaya. Masukan teknis dari para mitra menjadi acuan utama OIKN dalam menyempurnakan tata kelola dan pemeliharaan koleksi tanaman.\n\nSebagai langkah konkret, OIKN telah memasang paranet untuk meredam intensitas cahaya matahari dan suhu panas, sekaligus mengantisipasi dampak fenomena El Niño. Selain itu, alat pengukur suhu dipasang di area nurseri untuk memantau kondisi mikro lingkungan secara berkala.Di samping pemeliharaan rutin, OIKN terus mematangkan Taman Anggrek Nusantara sebagai ruang edukasi publik. \n\nPengelolaan koleksi kini lebih terstruktur melalui pendataan jenis dan jumlah anggrek, serta pembagian area nurseri ke dalam beberapa seksi. \n\nPenguatan lanskap dan fungsi ekologis kawasan juga dilakukan melalui penanaman bibit pohon di area ruang terbuka hijau.Sinergi berkelanjutan ini diharapkan dapat memperkuat upaya pelestarian anggrek sekaligus mewujudkan Taman Anggrek Nusantara sebagai sarana edukasi yang representatif bagi masyarakat.","dt":"11  April 2026"},{"id":1,"c":"Pengembangan taman","t":"Dorong Pengembangan Taman Anggrek Nusantara, Perawatan Koleksi di Nursery Terus Dimaksimalkan","d":"Ibu Kota Nusantara — Otorita Ibu Kota Nusantara (OIKN) terus mematangkan persiapan pembukaan Taman Anggrek Nusantara bagi masyarakat umum. Menjelang pembukaan tersebut, fokus utama saat ini diarahkan pada pengembangan kawasan serta pemeliharaan intensif seluruh koleksi anggrek yang terpusat di area nursery (persemaian).   \n\nLangkah ini diambil untuk memastikan seluruh tanaman berada dalam kondisi prima dan teradaptasi dengan baik sebelum dipamerkan di area publik. Pemeliharaan di nursery mencakup penyiraman berkala, pemberian nutrisi harian, hingga penyesuaian faktor lingkungan mikro.   \n\nGuna menunjang kembang tumbuh anggrek, area nursery telah dilengkapi dengan atap paranet untuk meredam intensitas cahaya matahari langsung serta mengantisipasi cuaca ekstrem. Pemantauan suhu dan kelembapan juga dilakukan secara berkala menggunakan alat pengukur khusus agar kondisi ideal tanaman tetap terjaga.   \n\nDi samping perawatan teknis, OIKN juga melakukan penataan koleksi secara terstruktur. Tanaman anggrek didata berdasarkan jenis dan jumlahnya, lalu ditempatkan ke dalam beberapa seksi penataan khusus di nursery. Langkah pendataan dan zonasi ini disiapkan agar saat taman resmi dibuka, kawasan ini siap menjadi sarana edukasi hayati yang informatif dan representatif bagi para pengunjung.   \n\nMelalui pengembangan dan perawatan yang terukur ini, Taman Anggrek Nusantara diharapkan siap menyambut masyarakat sekaligus menjadi ikon edukasi dan pelestarian keanekaragaman hayati di Ibu Kota Nusantara.","dt":"10  November 2026"}],"st":{"g":"13","j":"123"},"so":450,"gl":[{"n":"Phalaenopsis","d":"Anggrek epifit berdaun lebar dengan bunga yang tersusun pada tangkai."},{"n":"Dendrobium","d":"Genus besar anggrek epifit dengan batang menyerupai buluh."},{"n":"Arachnis","d":"Anggrek epifit berbatang panjang dan memanjat dengan bunga yang tersusun pada tangkai. Sebagian anggotanya dikenal sebagai anggrek kalajengking."},{"n":"Bulbophyllum","d":"Salah satu genus terbesar dalam famili anggrek, umumnya epifit dengan umbi semu dan bentuk bunga yang unik."},{"n":"Dipodium","d":"Anggrek dengan bunga besar dan berwarna mencolok pada tangkai yang tegak, mencakup jenis darat maupun yang memanjat."},{"n":"Eria","d":"Genus anggrek epifit dengan umbi semu memanjang dan bunga kecil yang umumnya berbulu halus."}],"sl":[{"n":"Dendrobium crumenatum","g":"Dendrobium","c":"Anggrek merpati"},{"n":"Arachnis celebica","g":"Arachnis","c":""},{"n":"Bulbophyllum beccarii","g":"Bulbophyllum","c":""},{"n":"Bulbophyllum biflorum","g":"Bulbophyllum","c":""},{"n":"Bulbophyllum brienianum","g":"Bulbophyllum","c":""},{"n":"Bulbophyllum lobbii","g":"Bulbophyllum","c":""},{"n":"Bulbophyllum macranthum","g":"Bulbophyllum","c":""},{"n":"Dendrobium Arendanggeren × Jade Fancy (mutasi)","g":"Dendrobium","c":"Anggrek hibrida"},{"n":"Dendrobium aureilobum","g":"Dendrobium","c":""},{"n":"Dendrobium barbatum","g":"Dendrobium","c":""},{"n":"Dendrobium bracteosum","g":"Dendrobium","c":""},{"n":"Dendrobium Cover King","g":"Dendrobium","c":"Anggrek hibrida"},{"n":"Dendrobium Mpu Gandring × Kick Covid","g":"Dendrobium","c":"Anggrek hibrida"},{"n":"Dendrobium Nandia Anandita × Aiko Yumna","g":"Dendrobium","c":"Anggrek hibrida"},{"n":"Dendrobium purpureum","g":"Dendrobium","c":""},{"n":"Dendrobium Tiara Beauty × Cut Nyak Dien","g":"Dendrobium","c":"Anggrek hibrida"},{"n":"Dipodium pictum","g":"Dipodium","c":""},{"n":"Eria javanica","g":"Eria","c":""},{"n":"Phalaenopsis fimbriata","g":"Phalaenopsis","c":""}],"sv":5,"x":{"t0":"Taman Anggrek Nusantara merupakan ruang konservasi, edukasi, dan penangkaran anggrek yang berlokasi di Kawasan Inti Pusat Pemerintahan (KIPP) Ibu Kota Nusantara. Didesain sebagai wadah pelestarian keanekaragaman hayati, taman ini menghadirkan kawasan hijau khusus yang memadukan keindahan estetika dengan upaya perlindungan flora khas Indonesia, khususnya ragam spesies anggrek asli Kalimantan dan berbagai varietas hibrida unggulan. Kawasan ini dikembangkan untuk merepresentasikan beberapa tipe habitat tumbuh anggrek—mulai dari dataran rendah hingga dataran sedang—guna menciptakan ekosistem alami yang ramah bagi kembang tumbuh anggrek.\n","t1":"Gagasan pembangunan Taman Anggrek Nusantara berawal pada Januari 2025 dari inisiasi Kepala Otorita Ibu Kota Nusantara, Bapak Muhamad Basuki Hadimuljono. Berangkat dari kesadaran akan besarnya potensi keanekaragaman flora di Kalimantan serta belum tersedianya kawasan khusus konservasi anggrek di IKN, ide ini diwujudkan menjadi langkah nyata. Pembangunan taman dilaksanakan secara bertahap, dengan fokus awal pada penyediaan sarana persemaian (nursery) serta pembuatan habitat alami dataran rendah dan sedang sebagai fondasi utama kawasan.","t2":"Pembangunan kawasan ini dilatarbelakangi oleh pentingnya menjaga kelestarian kekayaan anggrek Indonesia di tengah pesatnya pembangunan kawasan ibu kota baru. Taman Anggrek Nusantara dihadirkan bukan hanya sebagai destinasi wisata hijau yang mempercantik lanskap kota, tetapi juga sebagai sarana edukasi publik, pusat riset pelestarian hayati, dan ruang rekreasi berbasis lingkungan bagi masyarakat luas.","t3":"Taman ini diinisiasi oleh Otorita Ibu Kota Nusantara (OIKN) di bawah kepemimpinan Kepala OIKN, Bapak Muhamad Basuki Hadimuljono. Dalam perancangan dan pembangunannya, OIKN menjalin kolaborasi strategis dengan berbagai pihak, termasuk pakar keanekaragaman hayati, akademisi, serta komunitas pecinta anggrek di Kalimantan Timur untuk menyusun konsep kawasan yang ideal dan berkelanjutan.","t4":"Pengembangan koleksi anggrek di kawasan ini bertujuan untuk menginventarisasi, merawat, dan melestarikan kekayaan anggrek spesies asli Nusantara, sekaligus membudidayakan anggrek hibrida unggulan hasil pemuliaan tanaman. Melalui penataan koleksi yang terstruktur di area nursery hingga ruang terbuka publik, pengembangan ini diharapkan menjadi wadah pembelajaran bagi generasi mendatang untuk lebih mengenal, mencintai, dan menjaga kelestarian flora Indonesia."},"hd":"Taman Anggrek Nusantara merupakan kawasan taman tematik di Ibu Kota Nusantara yang dikembangkan sebagai ruang konservasi, pelestarian keanekaragaman hayati, dan edukasi anggrek. "}</script>
